name: build-windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: python -m pip install --upgrade pip -r requirements.txt pyinstaller pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Build CloudSync.exe
        run: >
          pyinstaller --onefile --windowed --name CloudSync
          --icon cloud-sync.ico
          --version-file packaging/version.txt
          --hidden-import cloudsync.__main__
          --add-data "cloud-sync.ico;."
          --collect-all customtkinter
          cloud_sync_app.py
      - name: Stage installer inputs
        shell: pwsh
        run: |
          $stage = "packaging/staging"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item dist/CloudSync.exe $stage/
          Copy-Item quickopen-root.crt, README.md, LICENSE $stage/ -ErrorAction SilentlyContinue
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss'
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloud-sync-windows
          path: |
            dist/CloudSync.exe
            packaging/dist/CloudSync-Setup.exe
          if-no-files-found: error
      - name: Upload staging (for signed repack)
        uses: actions/upload-artifact@v4
        with:
          name: cloud-sync-staging
          path: packaging/staging
          if-no-files-found: error
