name: build-linux
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-tk
          python -m pip install --upgrade pip -r requirements.txt pyinstaller pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Build CloudSync
        run: >
          pyinstaller --onefile --name CloudSync
          --hidden-import cloudsync.__main__
          --add-data "cloud-sync.png:."
          --add-data "assets:assets"
          --collect-all customtkinter
          cloud_sync_app.py
      - name: Stage tarball
        run: |
          VER="$(python -c 'import cloudsync; print(cloudsync.__version__)')"
          STAGE="packaging/staging/CloudSync-$VER-linux-x86_64"
          mkdir -p "$STAGE" packaging/dist
          cp dist/CloudSync "$STAGE/"
          cp cloud-sync.png LICENSE README.md "$STAGE/"
          cp packaging/quickopen-cloud-sync.desktop "$STAGE/"
          cp packaging/install.sh "$STAGE/"
          cp quickopen-root.crt "$STAGE/" 2>/dev/null || true
          tar -C packaging/staging -czf "packaging/dist/CloudSync-$VER-linux-x86_64.tar.gz" "CloudSync-$VER-linux-x86_64"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloud-sync-linux
          path: packaging/dist/CloudSync-*-linux-x86_64.tar.gz
          if-no-files-found: error
